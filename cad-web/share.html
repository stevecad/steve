<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1113" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>STEVE Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- Shown until the viewer's script has loaded (React replaces it on its first render). -->
    <div id="root">
      <style>@keyframes share-boot-spin { to { transform: rotate(360deg); } }</style>
      <div role="status" style="position: fixed; inset: 0; display: grid; place-items: center; font: 14px system-ui, sans-serif; color: #7d878d;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: share-boot-spin 0.8s linear infinite;"></span>
          <span>Loading the shared design…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/share/main.tsx"></script>
  </body>
</html>
